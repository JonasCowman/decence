<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Constat décence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b6d96">
<style>
/* Layout: carnet de terrain — une colonne au pouce sur téléphone, tuiles en grille, rubrique = liste de cartes dépliables */
:root{
  --bg:#eef3f6; --surface:#ffffff; --fg:#14212b; --muted:#5a6a76; --line:#d3dde4;
  --accent:#1b6d96; --accent-ink:#ffffff; --chip:#e3edf3;
  --danger:#b83227; --danger-bg:#fbe9e7; --warn:#9a6212; --warn-bg:#fdf1dc; --ok:#2b7a4b; --ok-bg:#e3f3e9;
  --paper:#ffffff; --ink:#111111;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#17222a; --fg:#e4ecf1; --muted:#9aabb7; --line:#2a3843;
  --accent:#62b2dc; --accent-ink:#08161e; --chip:#1e3340;
  --danger:#f07565; --danger-bg:#3a1d1a; --warn:#e3ac52; --warn-bg:#3a2c14; --ok:#63c58f; --ok-bg:#163223;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#17222a; --fg:#e4ecf1; --muted:#9aabb7; --line:#2a3843;
  --accent:#62b2dc; --accent-ink:#08161e; --chip:#1e3340;
  --danger:#f07565; --danger-bg:#3a1d1a; --warn:#e3ac52; --warn-bg:#3a2c14; --ok:#63c58f; --ok-bg:#163223;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .grow{flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .com{height:40px;width:auto;border-radius:4px;background:#fff;padding:2px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-icon{padding:8px;min-width:44px}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-weight:600}

.visits{display:grid;gap:10px;margin-block:14px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.visit .name{font-weight:700;font-size:1.05rem}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;display:grid;gap:8px;align-content:start;min-height:128px;cursor:pointer;color:var(--fg)}
.tile .ic{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--accent);display:grid;place-items:center}
.tile .ic svg.i{width:24px;height:24px}
.tile .num{font-family:var(--f-display);color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.tile .lbl{font-family:var(--f-display);font-size:1.08rem;line-height:1.15}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted);justify-self:start}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.danger{background:var(--danger-bg);color:var(--danger)}.pill.info{background:var(--chip);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrapin{max-width:860px;margin:0 auto;display:flex;gap:10px}
.bar .wrapin>*{flex:1}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px;margin-bottom:18px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.88rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-height:44px}
textarea{min-height:88px;resize:vertical}
textarea.big{min-height:360px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;background:var(--surface);cursor:pointer;font-size:.95rem;line-height:1.2}
label.chip input{position:absolute;opacity:0;width:1px;height:1px}
label.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.full .chips label.chip{border-radius:10px}
.hint{font-size:.85rem;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.hint.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}

.items{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.item.on.dg{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.item .head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.item .head input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.item .head .t{flex:1;min-width:0;font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ref{font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.body{display:grid;gap:12px;padding:0 14px 14px 50px}
.grp>span{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.dfs{display:grid;gap:6px;margin-top:6px}
.df{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border-radius:8px;padding:6px 6px 6px 10px;font-size:.92rem}
.df span{flex:1;min-width:0;padding-top:6px}
.df button{min-height:34px;min-width:34px;padding:4px}
.dgl{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:8px 12px;cursor:pointer;justify-self:start;min-height:44px}
.dgl input{width:20px;height:20px;accent-color:var(--danger)}
.phs{display:grid;gap:10px}
.phc{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px}
.phc img{width:110px;height:110px;object-fit:cover;border-radius:6px;display:block}
.phc .cap{display:grid;gap:6px;min-width:0}
.phc .cap b{font-family:var(--f-display);font-size:1.05rem}
.phc textarea{min-height:64px}
.phc .tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
button.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.cams{display:flex;gap:8px;flex-wrap:wrap}
.cam{border:2px dashed var(--accent);color:var(--accent);background:transparent;position:relative}
.cam input{position:absolute;opacity:0;width:1px;height:1px}
.need{color:var(--danger);font-weight:700;font-size:.85rem}

.sumtbl{display:grid;gap:8px;margin-bottom:18px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sumrow .lab{font-weight:600;min-width:0}
.pad{background:var(--paper);border:1px solid var(--line);border-radius:8px;width:100%;height:150px;touch-action:none;display:block}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.item,.tile{transition:border-color .15s,box-shadow .15s}}
@media (max-width:480px){.body{padding-left:14px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.phc{grid-template-columns:84px 1fr}.phc img{width:84px;height:84px}}
</style>

<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <main id="app"></main>
</div>
<div id="bar" class="bar" hidden><div class="wrapin" id="barin"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

// Normes CAF : 9 m² pour 1 personne, 16 m² pour 2, +9 m² par personne supplémentaire, 70 m² dès 8 personnes.
function normeCAF(n){n=+n;if(!(n>=1))return null;if(n>=8)return 70;return n===1?9:16+9*(n-2)}
console.assert(normeCAF(1)===9&&normeCAF(2)===16&&normeCAF(3)===25&&normeCAF(7)===61&&normeCAF(8)===70&&normeCAF(12)===70&&normeCAF(0)===null,'normeCAF');

/* ---------- liste de travaux ---------- */
function travaux(v){
  const L={};Object.keys(TH).forEach(k=>L[k]=[]);
  const bare=l=>l.replace(/^[\s•◦]+/,'');
  const push=(th,line)=>{if(!L[th].some(l=>bare(l)===bare(line)))L[th].push(line)};
  const diag=()=>{push('regl','• Réalisation et transmission au locataire du dossier de diagnostic technique :');
    ['Diagnostic de performance énergétique (DPE)','État de l’installation intérieure d’électricité',
     ...(v.f.lAv49==='Avant 1949'?['Constat de risque d’exposition au plomb (CREP), le logement ayant été construit avant 1949']:[]),
     'État des risques et pollutions (ERP)','État de l’installation intérieure de gaz, le cas échéant','Diagnostic amiante, le cas échéant (permis de construire antérieur au 1er juillet 1997)'].forEach(x=>push('regl','   ◦ '+x))};
  for(const r of R)for(const d of r.items||[]){
    const s=v.it[d.id];if(!s?.on||!d.th)continue;
    const subs=[];
    const add=x=>{if(!x)return;if(x==='DIAG')return diag();Array.isArray(x)?subs.push({th:x[0],t:x[1]}):subs.push({th:d.th,t:x})};
    s.o.forEach(i=>add(d.ow?.[i]));s.df.forEach(i=>add(d.df?.[i]?.[1]));(d.wx||[]).forEach(add);
    const main=subs.filter(x=>x.th===d.th);
    if(d.grp&&d.w){if(main.length){push(d.th,'• '+d.w+' :');main.forEach(x=>push(d.th,'   ◦ '+x.t))}else push(d.th,'• '+d.w)}
    else if(main.length)main.forEach(x=>push(d.th,'• '+x.t));
    else if(d.w)push(d.th,'• '+d.w);
    subs.filter(x=>x.th!==d.th).forEach(x=>push(x.th,'• '+x.t));
  }
  if(v.f.detect==='Non')push('sec','• Installation d’au moins un détecteur autonome avertisseur de fumée (DAAF) conforme à la norme NF EN 14604');
  return Object.entries(L).filter(([,l])=>l.length).map(([k,l])=>({title:TH[k],lines:l}));
}
function travauxTexte(v,blocks){
  const themes=blocks.map(b=>b.title.toLowerCase()).join(', ');
  const intro=v.f.cNd==='Oui'
    ?`Les désordres constatés ne permettent pas de considérer le logement comme décent. En l’état, le logement ne satisfait pas aux exigences du décret n° 2002-120 du 30 janvier 2002, notamment en matière de ${themes}.`
    :'Les travaux suivants sont préconisés pour remédier aux désordres constatés :';
  return intro+'\n\n'+blocks.map((b,i)=>`${i+1}. ${b.title}\n${b.lines.join('\n')}`).join('\n\n');
}
// Ajoute au texte existant les lignes générées manquantes, sans toucher à ce que l'utilisateur a rédigé.
function fusionTravaux(txt,blocks){
  const lines=txt.replace(/\s+$/,'').split('\n');let added=0;
  const norm=s=>s.trim();
  for(const b of blocks){
    const missing=b.lines.filter(l=>!lines.some(x=>norm(x)===norm(l)));
    if(!missing.length)continue;added+=missing.length;
    const h=lines.findIndex(x=>/^\d+\.\s/.test(x)&&x.replace(/^\d+\.\s+/,'').trim()===b.title);
    if(h<0){const n=lines.filter(x=>/^\d+\.\s/.test(x)).length+1;lines.push('',`${n}. ${b.title}`,...missing);continue}
    let end=h+1;while(end<lines.length&&!/^\d+\.\s/.test(lines[end]))end++;
    while(end>h+1&&!lines[end-1].trim())end--;
    lines.splice(end,0,...missing);
  }
  return{txt:lines.join('\n'),added};
}
(()=>{const t={f:{lAv49:'Avant 1949',detect:'Non',cNd:'Oui'},it:{elec:{on:true,o:[],t:[],df:[0,1],ph:[]},plomb:{on:true,o:[3],t:[],df:[],ph:[]}}};
  const b=travaux(t),txt=travauxTexte(t,b);
  console.assert(b[0].title===TH.sec&&b[0].lines[0].startsWith('• Mise en sécurité de l’installation électrique')&&b[0].lines.length===4,'travaux sec');
  console.assert(txt.includes('CREP')&&txt.includes('DAAF'),'travaux diag');
  const m=fusionTravaux('Intro\n\n1. Sécurité des occupants\n• Ma ligne perso',b);
  console.assert(m.txt.includes('• Ma ligne perso')&&m.txt.includes('2. Obligations réglementaires')&&fusionTravaux(m.txt,b).added===0,'fusion travaux');})();

 open(){return new Promise(res=>{try{const q=indexedDB.open('constat-decence',2);q.onupgradeneeded=()=>{const db=q.result;for(const n of ['visites','profil'])if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})};q.onsuccess=()=>{this.db=q.result;res(true)};q.onerror=()=>res(false)}catch(e){res(false)}})},
 tx(mode,fn,os='visites'){return new Promise((res,rej)=>{const t=this.db.transaction(os,mode);const r=fn(t.objectStore(os));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
 async all(){return this.db?await this.tx('readonly',s=>s.getAll()):[...this.mem.values()]},
 async put(v){if(!this.db){this.mem.set(v.id,v);return}await this.tx('readwrite',s=>s.put(v))},
 async del(id){if(!this.db){this.mem.delete(id);return}await this.tx('readwrite',s=>s.delete(id))},
 async getProfil(){return this.db?(await this.tx('readonly',s=>s.get('moi'),'profil'))||{id:'moi'}:this.mem.get('__moi')||{id:'moi'}},
 async putProfil(p){if(!this.db){this.mem.set('__moi',p);return}await this.tx('readwrite',s=>s.put(p),'profil')}

function phNums(r,v=cur){const m={};let n=0;for(const d of r.items||[]){const s=v.it[d.id];if(s?.on)s.ph.forEach((p,i)=>m[d.id+':'+i]=++n)}return m}

/* ---------- statuts ---------- */
const filled=x=>Array.isArray(x)?x.length>0:x!==undefined&&x!==null&&String(x).trim()!=='';
function rstat(r,v=cur){
  if(r.items){const on=r.items.filter(i=>v.it[i.id]?.on);
    const dg=on.some(i=>v.it[i.id].d),miss=on.filter(i=>i.p&&!v.it[i.id].ph.length).length;
    const p=[];
    if(on.length)p.push([`${on.length} désordre${on.length>1?'s':''}`,'info']);else if(v.done[r.id])p.push(['RAS','ok']);
    if(dg)p.push(['Danger','danger']);
    if(miss)p.push([`${miss} photo${miss>1?'s':''} manquante${miss>1?'s':''}`,'warn']);
    if(!p.length)p.push(['À faire','']);
    return p}
  const n=r.fields.filter(f=>filled(v.f[f[0]])).length;
  return [[n?(v.done[r.id]?'Terminé':`${n}/${r.fields.length} renseignés`):'À faire',n?(v.done[r.id]?'ok':'info'):'']]
}
const sumAuto=(k,v=cur)=>Object.values(ITEMS).some(i=>i.s===k&&v.it[i.id]?.on);
const sumVal=(k,v=cur)=>v.f['sum_'+k]||(sumAuto(k,v)?'Oui':'Non');
const pills=p=>`<div class="pills">${p.map(([t,c])=>`<span class="pill ${c}">${esc(t)}</span>`).join('')}</div>`;

/* ---------- rendu ---------- */
function field([k,label,type,opts,hint,cond]){
  if(k==='h')return `<h3>${esc(label)}</h3>`;
  if(cond&&!cond(cur))return '';
  const v=cur.f[k];const full=type==='ta'||(type==='c'||type==='r')&&opts.join('').length>40;
  let ctl;
  if(type==='r'||type==='c'){
    ctl=`<div class="chips" role="group" aria-label="${esc(label)}">${opts.map(o=>{const ch=type==='r'?v===o:(v||[]).includes(o);
      return `<label class="chip"><input type="${type==='r'?'radio':'checkbox'}" name="${k}" data-f="${k}" data-ft="${type}" value="${esc(o)}" ${ch?'checked':''}>${esc(k==='dem'?COM[o].label:o)}</label>`}).join('')}</div>`;
  }else if(type==='ta')ctl=`<textarea id="f_${k}" data-f="${k}" ${k==='trav'?'class="big"':''}>${esc(v)}</textarea>`;
  else{const t={t:'text',n:'number',d:'date',tel:'tel',email:'email'}[type];
    ctl=`<input id="f_${k}" type="${t}" data-f="${k}" value="${esc(v)}" ${type==='n'?'inputmode="decimal" step="any"':''}>`}
  return `<div class="field ${full?'full':''}"><span>${esc(label)}</span>${ctl}${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`;
}
function itemHtml(d,nums){

  let norm='';
  if(d.norm){const n=cur.f.lNbOcc,m=normeCAF(n),sf=+cur.f.lSurf;
    norm=m?`<div class="hint ${sf&&sf<m?'warn':''}">Norme CAF pour ${n} occupant${n>1?'s':''} : ${m} m² minimum. Logement : ${sf?sf+' m²':'superficie non renseignée (rubrique 1)'}${sf&&sf<m?' → sur-occupation':''}.</div>`
          :`<div class="hint">Renseignez le nombre d'occupants et la superficie en rubrique 1 pour comparer à la norme CAF (9 m² pour 1 personne, 16 m² pour 2, +9 m² par personne, 70 m² dès 8).</div>`}
  const dfFree=(d.df||[]).map((x,i)=>[x,i]).filter(([,i])=>!s.df.includes(i));
  return `<div class="item ${s.on?'on':''} ${s.on&&s.d?'dg':''}" id="it_${d.id}">
   <label class="head"><input type="checkbox" data-it="${d.id}" data-k="on" ${s.on?'checked':''}>
    <div class="t">${esc(d.t)}<div class="meta">${d.ref?`<span class="ref">${esc(d.ref)}</span>`:''}${d.p?`<span class="ref">Photo requise</span>`:''}${s.on&&s.ph.length?`<span class="ref">${s.ph.length} photo${s.ph.length>1?'s':''}</span>`:''}</div></div></label>
   ${d.norm&&!s.on?`<div class="body">${norm}</div>`:''}
   ${s.on?`<div class="body">
    ${d.hint?`<div class="hint">${esc(d.hint)}</div>`:''}${norm}
    ${d.ty&&d.tl!==MEL?grp('t',d.tl,d.ty):''}

    ${d.ty&&d.tl===MEL?grp('t',d.tl,d.ty):''}

      <select data-it="${d.id}" data-k="df" aria-label="Ajouter un défaut type"><option value="">+ Ajouter un défaut type…</option>${dfFree.map(([x,i])=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select>
      ${s.df.length?`<div class="dfs">${s.df.map(i=>`<div class="df"><span>${esc(d.df[i][0])}</span><button type="button" data-act="deldf" data-it="${d.id}" data-i="${i}" aria-label="Retirer ce défaut">${svg('x')}</button></div>`).join('')}</div>`:''}</div>`:''}
    ${d.d?`<label class="dgl"><input type="checkbox" data-it="${d.id}" data-k="d" ${s.d?'checked':''}>Danger</label>`:''}
    <label class="field"><span>Précisions (3) : localisation, description</span><textarea data-it="${d.id}" data-k="note" placeholder="Ex. : chambre, prise arrachée de son support (voir photo 1)">${esc(s.note)}</textarea></label>
    <div class="grp"><span>Photos${d.p&&!s.ph.length?' <span class="need">— à joindre impérativement</span>':''}</span>
     <div class="phs">${s.ph.map((p,i)=>`<div class="phc"><img src="${p.src}" alt="Photo ${nums[d.id+':'+i]}">
       <div class="cap"><div class="tools"><b>Photo ${nums[d.id+':'+i]}</b><button type="button" data-act="delph" data-it="${d.id}" data-i="${i}">Supprimer</button></div>
       <textarea data-it="${d.id}" data-k="cap" data-i="${i}" placeholder="Légende : ce que montre la photo">${esc(p.cap)}</textarea></div></div>`).join('')}
      <div class="cams"><label class="btn cam">${svg('cam')}Prendre une photo<input type="file" accept="image/*" capture="environment" data-photo="${d.id}"></label>
      <label class="btn cam">${svg('plus')}Depuis la galerie<input type="file" accept="image/*" multiple data-photo="${d.id}"></label></div></div></div>
   </div>`:''}
  </div>`;
}

/* ---------- signature ---------- */
function initPad(src,done){
  const c=$('#pad');if(!c)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle=getComputedStyle(c).getPropertyValue('--ink')||'#111';
  if(src){const im=new Image();im.onload=()=>{const k=Math.min(c.clientWidth/im.naturalWidth,c.clientHeight/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;g.drawImage(im,(c.clientWidth-w)/2,(c.clientHeight-h)/2,w,h)};im.src=src}
  let drawing=false;const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...pt(e))};
  c.onpointermove=e=>{if(!drawing)return;g.lineTo(...pt(e));g.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(!drawing)return;drawing=false;done(c.toDataURL('image/png'),c.clientHeight/c.clientWidth)};
}

/* ---------- photos ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('image illisible'));im.src=src})}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const im=await loadImg(url);const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);return{src:c.toDataURL('image/jpeg',.72),w,h,cap:''}}
  finally{URL.revokeObjectURL(url)}
}

/* ---------- événements ---------- */
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.p){P[el.dataset.p]=el.value.trim();saveP();return}
  if(!cur)return;
  if(el.dataset.f&&!el.dataset.ft){cur.f[el.dataset.f]=el.value;save();return}
  if(el.dataset.it&&el.dataset.k==='note'){it(el.dataset.it).note=el.value;save()}
  if(el.dataset.it&&el.dataset.k==='cap'){it(el.dataset.it).ph[+el.dataset.i].cap=el.value;save()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.import!==undefined)return importJson(el);
  if(el.dataset.psig!==undefined){const f=el.files[0];el.value='';if(!f)return;try{const p=await shrink(f);P.sig={src:p.src,r:p.h/p.w};await saveP();render()}catch(err){toast('Image non importée : '+err.message)}return}
  if(!cur)return;
  if(el.dataset.ft==='r'){cur.f[el.dataset.f]=el.value;save();if(view==='synth'||el.dataset.f==='dem')keep();return}
  if(el.dataset.ft==='c'){const a=cur.f[el.dataset.f]=(cur.f[el.dataset.f]||[]).filter(x=>x!==el.value);if(el.checked)a.push(el.value);save();return}
  if(el.dataset.it&&el.dataset.k){
    const s=it(el.dataset.it),k=el.dataset.k;
    if(k==='on'||k==='d'){s[k]=el.checked;save();return keep()}
    if(k==='df'){if(el.value==='')return;s.df.push(+el.value);save();return keep()}
    if(k==='o'||k==='t'){const i=+el.dataset.i;s[k]=s[k].filter(x=>x!==i);if(el.checked)s[k].push(i);s[k].sort((a,b)=>a-b);save();return}
  }
  if(el.dataset.photo){
    const s=it(el.dataset.photo),files=[...el.files];el.value='';
    for(const f of files){try{s.ph.push(await shrink(f))}catch(err){toast('Photo non ajoutée : '+err.message)}}
    await save(true);keep();toast(files.length>1?files.length+' photos ajoutées':'Photo ajoutée');
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='new'){cur=newVisit();visits.push(cur);await save(true);view='admin';return go()}
  if(a==='open'){cur=visits.find(v=>v.id===b.dataset.id);view='dash';return go()}
  if(a==='ctrl'){const src=visits.find(v=>v.id===b.dataset.id);cur=structuredClone(src);Object.assign(cur,{id:newVisit().id,created:Date.now(),done:{},sig:''});cur.f.typeVis='Visite de contrôle';cur.f.dateVis=today();visits.push(cur);await save(true);view='dash';toast('Visite de contrôle créée à partir de la visite initiale');return go()}
  if(a==='delv'){if(!armed(b,'Confirmer la suppression'))return;await store.del(b.dataset.id);visits=visits.filter(v=>v.id!==b.dataset.id);return render()}
  if(a==='list'){await save(true);cur=null;view='list';return go()}
  if(a==='dash'){view='dash';return go()}
  if(a==='go'){view=b.dataset.v;return go()}
  if(a==='markdone'){cur.done[b.dataset.r]=!cur.done[b.dataset.r];save();return render()}
  if(a==='delph'){if(!armed(b,'Confirmer'))return;it(b.dataset.it).ph.splice(+b.dataset.i,1);save();return keep()}
  if(a==='deldf'){const s=it(b.dataset.it);s.df=s.df.filter(i=>i!==+b.dataset.i);save();return keep()}
  if(a==='clrsig'){cur.sig='';cur.sigR=0;save();return render()}
  if(a==='clrpsig'){delete P.sig;saveP();return render()}
  if(a==='gentrav'){
    const blocks=travaux(cur);
    if(!blocks.length){toast('Aucun désordre coché : rien à pré-remplir');return}
    let msg;
    if(!filled(cur.f.trav)){cur.f.trav=travauxTexte(cur,blocks);msg='Liste de travaux pré-remplie'}
    else{const m=fusionTravaux(cur.f.trav,blocks);cur.f.trav=m.txt;msg=m.added?`${m.added} correctif${m.added>1?'s':''} ajouté${m.added>1?'s':''}`:'Liste déjà à jour'}
    const rap=new Set(cur.f.rap||[]);RAP.forEach(([t,f])=>{if(f(cur))rap.add(t)});cur.f.rap=[...rap];
    save();keep();toast(msg);return;
  }
  if(a==='pdf'){await save(true);if(!P.nom){toast('Renseignez d’abord votre profil : il figure sur le rapport');view='profil';return go()}return exportPdf(cur).catch(err=>toast('PDF impossible : '+err.message))}
  if(a==='export')return exportJson();
});
// Suppression en deux temps : le premier appui arme le bouton, le second confirme.
function armed(b,label){if(b.classList.contains('armed'))return true;b.classList.add('armed');const old=b.textContent;b.textContent=label;setTimeout(()=>{b.classList.remove('armed');b.textContent=old},3000);return false}
function go(){render();scrollTo(0,0)}

/* ---------- fichiers ---------- */
async function offer(filename,blob){
  const dl=window.claude?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});toast('Fichier enregistré')}catch(e){if(e.code!=='declined')toast('Enregistrement impossible ('+(e.code||e.message)+')')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/^_|_$/g,'');
function exportJson(){offer(`sauvegarde_constats_${today()}.json`,new Blob([JSON.stringify({app:'constat-decence',v:2,visits})],{type:'application/json'}))}
async function importJson(el){
  const f=el.files[0];el.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='constat-decence'||!Array.isArray(d.visits))throw new Error('ce fichier n’est pas une sauvegarde de cette application');
    let n=0;for(const v of d.visits){if(!v||typeof v.id!=='string'||typeof v.f!=='object'||typeof v.it!=='object')continue;await store.put(migrate(v));n++}
    visits=(await store.all()).map(migrate);render();toast(`${n} visite${n>1?'s':''} importée${n>1?'s':''}`)}
  catch(e){toast('Import impossible : '+e.message)}
}

/* ---------- PDF : tableaux au format de la fiche ---------- */
async function exportPdf(v){
  if(!window.jspdf){toast("Le module PDF n'est pas chargé : ouvrez l'application une fois avec internet.");return}
  toast('Génération du PDF…');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=12,CW=W-2*M,TOP=12,BOT=H-14,PAD=1.5;
  const BLK=[0,0,0],RED=[200,0,0],BLUE=[0,70,170],GRAY=[217,217,217];let y=TOP;
  // Polices PDF standard : jeu de caractères Windows-1252 uniquement.
  const T=s=>String(s??'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[–—]/g,'-').replace(/→/g,'->').replace(/◦/g,'-').replace(/\t/g,' ').replace(/[^\x0a\x20-\xff€•]/g,'');
  const LH=sz=>sz*.3528*1.2;
  const font=(sz,st='normal',c=BLK)=>{doc.setFont('helvetica',st);doc.setFontSize(sz);doc.setTextColor(...c)};
  const sty=o=>o.b&&o.i?'bolditalic':o.b?'bold':o.i?'italic':'normal';
  const box=(x,yb,on)=>{doc.setDrawColor(0);doc.setLineWidth(.25);doc.rect(x,yb-2.45,2.5,2.5);if(on){doc.line(x+.45,yb-2,x+2.05,yb-.4);doc.line(x+2.05,yb-2,x+.45,yb-.4)}};
  const dims={};for(const s of [LOGO,...Object.values(COM).map(c=>c.logo)]){try{const im=await loadImg(s);dims[s]=[im.naturalWidth,im.naturalHeight]}catch(e){}}
  const fmt=s=>s.startsWith('data:image/png')?'PNG':'JPEG';

  const tx=(s,o={})=>({t:'txt',s,...o}),cb=(on,s,o={})=>({t:'cb',on,s,...o}),cbs=(list,o={})=>({t:'cbs',list,...o}),gap=h=>({t:'gap',h});
  const img=(src,w,h,o={})=>({t:'img',src,w,h,...o});
  // Transforme le contenu d'une cellule en blocs d'une ligne, pour pouvoir couper une ligne de tableau entre deux pages.
  function blocks(items,w){
    const out=[];
    for(const o of items){
      const sz=o.sz||8.5,lh=LH(sz),c=o.c||BLK,st=sty(o),ind=o.ind||0;
      if(o.t==='gap'){out.push({h:o.h,draw(){}});continue}
      if(o.t==='txt'){for(const p of T(o.s).split('\n')){font(sz,st);const ls=p.trim()?doc.splitTextToSize(p,w-ind):[''];
        for(const ln of ls)out.push({h:lh,draw(x,yy){font(sz,st,c);const al=o.al||'left';doc.text(ln,al==='center'?x+w/2:al==='right'?x+w:x+ind,yy+lh*.78,{align:al})}})}continue}
      if(o.t==='cb'){if(!o.s){out.push({h:lh,draw(x,yy){box(x+(w-2.5)/2,yy+lh*.78,o.on)}});continue}
        font(sz,st);const ls=doc.splitTextToSize(T(o.s),w-ind-3.6);
        ls.forEach((ln,k)=>out.push({h:lh,draw(x,yy){if(!k)box(x+ind,yy+lh*.78,o.on);font(sz,st,c);doc.text(ln,x+ind+3.6,yy+lh*.78)}}));continue}
      if(o.t==='cbs'){font(sz,st);const pcs=[];if(o.pre)pcs.push({pre:T(o.pre),w:doc.getTextWidth(T(o.pre))+2});
        for(const [on,l] of o.list)pcs.push({on,l:T(l),w:3.4+doc.getTextWidth(T(l))+3.5});
        const lines=[[]];let cw=0;for(const p of pcs){if(cw+p.w>w-ind&&lines.at(-1).length){lines.push([]);cw=0}lines.at(-1).push(p);cw+=p.w}
        for(const L of lines){const tw=L.reduce((a,p)=>a+p.w,0);out.push({h:lh,draw(x,yy){let xx=x+ind+(o.al==='center'?(w-tw)/2:o.al==='right'?w-tw:0);const yb=yy+lh*.78;font(sz,st,c);
          for(const p of L){if(p.pre!==undefined)doc.text(p.pre,xx,yb);else{box(xx,yb,p.on);font(sz,st,c);doc.text(p.l,xx+3.4,yb)}xx+=p.w}}})}continue}
      if(o.t==='img'){const mw=Math.min(o.maxW||w,w),mh=o.maxH||70;let dw=mw,dh=mw*o.h/o.w;if(dh>mh){dh=mh;dw=dh*o.w/o.h}
        out.push({h:dh+1.5,draw(x,yy){doc.addImage(o.src,fmt(o.src),x+(o.al==='left'?0:(w-dw)/2),yy+.5,dw,dh)}});continue}
    }
    return out;
  }
  const newPage=()=>{doc.addPage();y=TOP};
  // Dessine une ligne de tableau ; la ligne continue sur la page suivante si elle est trop haute.
  function row(cells,widths,o={}){
    const cols=cells.map((c,i)=>{c=Array.isArray(c)?{items:c}:c;return{...c,bl:blocks(c.items,widths[i]-2*PAD)}});
    let first=true;
    for(;;){
      const avail=BOT-y-2*PAD;
      const take=cols.map(c=>{let h=0,n=0;while(n<c.bl.length&&h+c.bl[n].h<=avail){h+=c.bl[n].h;n++}return{n,h}});
      const allFit=take.every((t,i)=>t.n===cols[i].bl.length);
      const total=Math.max(0,...cols.map(c=>c.bl.reduce((a,b)=>a+b.h,0)));
      if(first&&!allFit&&(total<o.keep||total<40||take.every(t=>t.n===0))&&y>TOP+1){newPage();continue}
      if(take.every(t=>t.n===0))take.forEach((t,i)=>{if(cols[i].bl.length){t.n=1;t.h=cols[i].bl[0].h}});
      const hh=Math.max(first&&o.minH?o.minH:0,Math.max(...take.map(t=>t.h))+2*PAD);
      let x=M;
      cols.forEach((c,i)=>{const w=widths[i];if(c.fill){doc.setFillColor(...c.fill);doc.rect(x,y,w,hh,'F')}
        doc.setDrawColor(0);doc.setLineWidth(.2);doc.rect(x,y,w,hh);
        const t=take[i];let yy=y+PAD+(allFit&&c.va==='middle'?(hh-2*PAD-t.h)/2:0);
        c.bl.splice(0,t.n).forEach(b=>{b.draw(x+PAD,yy);yy+=b.h});x+=w});
      y+=hh;first=false;
      if(!cols.some(c=>c.bl.length))break;
      newPage();
    }
  }
  const flow=items=>{for(const b of blocks(items,CW)){if(y+b.h>BOT)newPage();b.draw(M,y);y+=b.h}};
  const need=h=>{if(y+h>BOT)newPage()};
  const f=v.f,com=COM[f.dem]||COM.CAF,yn=(val,lo)=>[[val==='Oui',lo?'oui':'Oui'],[val==='Non',lo?'non':'Non']];

  /* --- page 1 : en-tête --- */
  const logoItem=(s,mw,mh)=>dims[s]?[img(s,dims[s][0],dims[s][1],{maxW:mw,maxH:mh})]:[];
  row([{items:logoItem(LOGO,40,18),va:'middle'},
       {items:[tx('Diagnostic Constat décence',{b:1,sz:13,al:'center'}),gap(2.5),tx("Visant à caractériser un logement dégradé à partir d'un constat visuel des désordres susceptibles de relever de l'application du Règlement Sanitaire Départemental et/ou du décret relatif aux caractéristiques du logement décent",{i:1,sz:8.5,al:'center'})],va:'middle'},
       {items:logoItem(com.logo,38,26),va:'middle'}],[46,96,44],{minH:30});
  row([[tx('Date demande : '+frDate(f.dateDem)),gap(1.5),tx('Date visite : '+frDate(f.dateVis)),gap(1.5),tx('Date rapport : '+frDate(today()))],
       [tx('Rapport établi par : '+(P.nom||''),{b:1}),tx('Pour les questions techniques relatives aux travaux préconisés :',{b:1}),tx(`Téléphone : ${P.tel||''} // Mail : ${P.mail||''}`),tx('Pour toutes autres questions : '+ADIL,{b:1,c:RED})],[]],[46,96,44]);
  y+=4;
  /* --- informations administratives --- */
  const LW=[38,148];
  row([[tx('Demandeur',{b:1})],[cbs(Object.keys(COM).map(k=>[f.dem===k,COM[k].label]))]],LW);
  row([[tx('Référence dossier',{b:1})],[isCAF(v)?tx(`Matricule CAF : ${f.matricule||''}          N° allocataire : ${f.alloc||''}`):tx(f.refDos||'')]],LW);
  row([[tx('Occupant-Adresse',{b:1}),gap(2),tx("Date d'entrée dans les lieux :",{b:1}),tx(frDate(f.dateEntree))],
       [tx(`Nom : ${f.nom||''}     Prénom : ${f.prenom||''}     Loyer : ${f.loyer?f.loyer+' €':''}     Aide : ${f.aide?f.aide+' €':''}`),
        tx(`Adresse : ${f.adresse||''}     Ville/CP : ${f.cpville||''}`),
        tx(`Bât/rés : ${f.bat||''}     Entrée : ${f.entree||''}     Étage : ${f.etage||''}     N° de la maison dans la courée : ${f.couree||''}`),
        tx(`Tél fixe : ${f.telFixe||''}     Tél portable : ${f.telPort||''}     Mail : ${f.mail||''}`)]],LW);
  const bt=f.bailType||[];
  row([[cb(bt.includes('Propriétaire(s)'),'Propriétaire(s)',{b:1}),gap(1),cb(bt.includes('Gestionnaire(s)'),'Gestionnaire(s)',{b:1})],[tx('Nom, prénom, adresse, n° de téléphone : '+(f.bailCoord||''))]],LW);
  row([{items:[tx('Type de visite',{b:1})],va:'middle'},[cb(f.typeVis==='Visite initiale','VISITE INITIALE'),gap(1),cb(f.typeVis==='Visite de contrôle','VISITE DE CONTRÔLE')]],LW);
  row([{items:[tx('RÉSUMÉ DES DÉSORDRES RELEVÉS',{b:1})],fill:GRAY,va:'middle'},
       [...Object.values(SUM).map(l=>tx(l,{al:'right'}))],
       [...Object.keys(SUM).map(k=>cbs(yn(sumVal(k,v))))]],[38,110,38]);
  y+=4;
  row([{items:[tx('CARACTÉRISATION DE LA SITUATION ET CONCLUSION : Qualification des désordres',{b:1,al:'center'}),tx('(Plusieurs cases « oui » peuvent être cochées)',{i:1,al:'center',c:BLUE})],fill:GRAY}],[CW]);
  row([[tx('Non décence – Infraction RSD',{al:'center'}),cbs(yn(f.cNd),{al:'center'})]],[CW]);
  row([{items:[tx('Présomption relevant de l’habitat indigne',{b:1,al:'right'})],fill:GRAY,va:'middle'},
       [cbs(yn(f.cInsal,1),{pre:'Insalubrité',al:'center'}),cbs(yn(f.cPeril,1),{pre:'Péril',al:'center'})]],[60,126]);
  y+=5;need(34);font(9,'italic');doc.text('Signatures',M+20,y+3);
  if(P.sig){const w=Math.min(50,24/P.sig.r);doc.addImage(P.sig.src,fmt(P.sig.src),M+15,y+5,w,w*P.sig.r)}
  font(8);doc.text(T(P.nom||''),M+15,y+32)
  if(v.sig){font(9,'italic');doc.text("L'occupant",M+110,y+3);const w=60;doc.addImage(v.sig,'PNG',M+100,y+5,w,w*(v.sigR||.375))}
  newPage();

  /* --- rubrique 1 --- */
  const lt=f.lType||[];
  row([{items:[tx('1/ LOGEMENT',{b:1})],fill:GRAY,va:'middle'},
       [cbs([[lt.includes('Individuel'),'individuel'],[lt.includes('Meublé'),'meublé'],[lt.includes('Collectif'),'collectif,']]),tx('nombre de logements : '+(f.lNbLog||''),{i:1})],
       [tx('Date construction : '+(f.lConstr||''),{b:1}),cbs([[f.lAv49==='Avant 1949','<1949'],[f.lAv49==='Après 1949','>1949'],[f.lAv49==='NSP','NSP']])]],[38,98,50]);
  row([{items:[tx('Superficie :',{b:1}),gap(4),tx((f.lSurf||'')+'  m²',{al:'center',sz:10})]},
       [cbs(yn(f.lP9,1),{pre:'Présence d’au moins une pièce principale (2) de plus de 9 m² :'}),
        tx(`Nombre : - de pièce(s) principale(s) : ${f.lNbPP||''}   dont chambre(s) : ${f.lNbCh||''}`),
        tx(`- de salle(s) de bain : ${f.lNbSdb||''} ; de cuisine(s) : ${f.lNbCuis||''} ; de WC : ${f.lNbWc||''}`,{ind:12}),
        cbs(yn(f.lAnim,1),{pre:'Présence d’animaux dans le logement :'}),tx('(préciser) : '+(f.lAnimP||''),{i:1}),
        tx('Autres informations : '+(f.lAutres||''),{i:1})]],[38,148]);
  row([[cbs(yn(f.lBail,1),{pre:'Bail écrit :'}),cbs(yn(f.lEdl,1),{pre:'État des lieux d’entrée :'}),tx('(si oui, que révèle-t-il sur l’état du logement ?) : '+(f.lEdlP||''),{i:1})]],[CW]);
  row([[tx("Nombre d'occupants : "+(f.lNbOcc||''))],[tx('Adultes (indiquer les âges) : '+(f.lAdultes||''))],[tx('Enfants (indiquer les âges) : '+(f.lEnfants||''))]],[50,68,68]);
  y+=3;
  row([[tx('Personnes présentes lors de l’enquête',{b:1}),tx('(Nom, prénom, qualité)',{i:1,sz:7.5})],[tx(f.lPresents||'',{b:1})]],[38,148]);
  y+=4;

  /* --- rubriques 2 à 6 --- */
  const IW=[54,26,90,16],NOTE={2:'2 : Pièce principale = Chambre, séjour, Salon, Salle à manger ; S > 9 m² dans une pièce min, > 7 m² dans les suivantes, H > 2,20 m',
    3:'3 : Préciser : localisation, description : joindre impérativement des photos',
    4:'4 : Obligatoire pour tout logement d’avant 1949 mis en location après le 12 août 2008',
    5:'5 : Pièce par pièce : 2 ventilations (haute et basse) ou une ventilation haute et un ouvrant sur l’extérieur (WC et salle de bain)',
    6:'6 : Balayage : arrivée air neuf dans les pièces principales et sortie air vicié par les pièces de service (WC, salle de bain, cuisine)',
    7:'7 : Normes CAF : 09 m² de surface habitable pour 1 personne isolée ; 16 m² pour 2 personnes ; + 9 m² par personne supplémentaire ; au moins 70 m² pour 8 personnes et plus'};
  const notes=ns=>{y+=1;flow(ns.map(n=>tx(NOTE[n],{sz:7})));y+=4};
  for(const r of R.filter(r=>r.items)){
    need(40);const nums=phNums(r,v);
    row([{items:[tx(`${r.n}/ ${r.pt}`,{b:1})],fill:GRAY},{items:r.nod?[]:[tx('Danger',{b:1,al:'center'})],fill:GRAY}],[170,16]);
    for(const d of r.items){
      const s=v.it[d.id]||{on:false,o:[],t:[],df:[],note:'',d:false,ph:[]};
      const c1=[cb(s.on,d.t,{b:s.on})],c3=[];
      if(d.ty&&d.tl!==MEL){c1.push(gap(1),tx(d.tl+' :',{i:1,sz:8}));d.ty.forEach((x,i)=>c1.push(cb(s.t.includes(i),x,{ind:2})))}
      if(d.o){if(d.ol)c3.push(tx(d.ol+' :',{i:1}));d.o.forEach((x,i)=>c3.push(cb(s.o.includes(i),x)))}
      if(d.ty&&d.tl===MEL){c3.push(gap(1),tx(d.tl+' :',{i:1}));d.ty.forEach((x,i)=>c3.push(cb(s.t.includes(i),x)))}
      s.df.forEach(i=>c3.push(cb(true,d.df[i][0])));
      if(d.norm&&s.on){const m=normeCAF(f.lNbOcc);if(m)c3.push(tx(`Norme CAF pour ${f.lNbOcc} occupant(s) : ${m} m² minimum. Superficie : ${f.lSurf||'non renseignée'} m².`))}
      if(c3.length)c3.push(gap(1));
      c3.push(tx('(3) '+(s.on?s.note||'':''),{c:RED}));
      if(s.on)s.ph.forEach((p,i)=>{c3.push(gap(1),img(p.src,p.w,p.h,{maxH:62}),tx(`Photo ${nums[d.id+':'+i]}${p.cap?' : '+p.cap:''}`,{i:1,sz:8}))});
      row([c1,[tx(d.ref||'')],c3,d.d?{items:[cb(s.on&&s.d,'')],va:'middle'}:[]],IW,{keep:70});
    }
    if(r.id==='r4')row([[tx('Installation de détecteur de fumée :'),cbs(yn(f.detect))],[tx('Article R129-12')],[tx('Nombre de détecteur de fumée : '+(f.detectNb??''))],[]],IW);
    notes(r.id==='r3'?[2,3]:r.id==='r6'?[3,4,5,6,7]:[3]);
  }
  /* --- rubriques 7 et 8 --- */
  need(40);
  row([{items:[tx('7/ '+R[6].pt,{b:1})],fill:GRAY}],[CW]);
  row([[tx(f.comm||'')]],[CW],{minH:30});
  if(isCAF(v)){y+=2;flow([tx("« Les informations collectées sur le logement peuvent faire l’objet d’un traitement informatique par la caisse d’allocations familiales ou dans le cadre de l’outil de repérage et de traitement de l’habitat indigne (ORTHI). Ces informations peuvent être transmises aux institutions compétentes en matière d’habitat indigne : agence régionale de santé, collectivités territoriales, Fonds de solidarité logement et être utilisées aux fins d’études, d’enquêtes et de sondages. Vous pouvez exercer votre droit d’accès et de rectification auprès du directeur de la Caf (demande formulée par courrier postal accompagnée d’une preuve d’identité) et dans le cadre d’ORTHI auprès du préfet du département où se situe le logement selon les modalités prévues par l'article 5 de l'arrêté du 30 septembre 2011 portant création d'un traitement de données à caractère personnel relatif à l'habitat indigne et non décent. »",{sz:7,b:1})])}
  newPage();
  row([{items:[tx('8/ '+R[7].pt,{b:1})],fill:GRAY}],[CW]);
  const tl=String(f.trav||'').split('\n').map(l=>/^\d+\.\s/.test(l)?tx(l,{b:1,sz:9}):/^\s*◦/.test(l)?tx('-  '+l.replace(/^\s*◦\s*/,''),{ind:9}):/^\s*•/.test(l)?tx(l.trim(),{ind:3}):l.trim()?tx(l):gap(1.5));
  row([tl],[CW],{minH:40});
  const rap=[...(f.rap||[]),...(filled(f.rapAutre)?[f.rapAutre]:[])];
  if(rap.length){y+=4;need(30);row([{items:[tx('RAPPELS AUX OCCUPANTS',{b:1})],fill:GRAY}],[CW]);row([rap.map(x=>tx('• '+x,{ind:1}))],[CW])}

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);font(7.5,'italic');doc.text(T(`Constat Décence ${com.foot} / SOLIHA Charente-Maritime Deux-Sèvres`),M,H-7);font(7.5,'bold');doc.text(`Page ${i} sur ${n}`,W-M,H-7,{align:'right'})}
  await offer(`Constat_decence_${slug(f.nom)||'logement'}_${f.dateVis||today()}.pdf`,doc.output('blob'));
}

  if(!await store.open()){const b=$('#banner');b.hidden=false;b.textContent="Stockage indisponible sur ce navigateur : les visites seront perdues à la fermeture. Exportez une sauvegarde ou le PDF avant de quitter."}
